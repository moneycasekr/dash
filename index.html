<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0d12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="채널 현황">
<title>채널 현황</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0d12; --card:#141822; --line:#222838; --text:#f2f4f8; --sub:#8a93a6;
  --up:#4ade80; --down:#f87171;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg)}
body{color:var(--text);font-family:"Noto Sans KR",system-ui,sans-serif;
  padding:calc(env(safe-area-inset-top) + 16px) 16px calc(env(safe-area-inset-bottom) + 24px);
  max-width:760px;margin:0 auto;-webkit-font-smoothing:antialiased}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:8px}
.top h1{font-size:18px;font-weight:800}
.upd{font-size:12px;color:var(--sub)}
.seg{display:flex;background:var(--card);border-radius:10px;padding:3px;margin-bottom:14px}
.seg button{flex:1;border:0;background:none;color:var(--sub);font:inherit;font-size:13px;
  font-weight:500;padding:7px 0;border-radius:8px;cursor:pointer}
.seg button.on{background:#262c3b;color:var(--text);font-weight:700}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:10px}
.tile{background:var(--card);border-radius:16px;padding:14px 14px 16px}
.tile .k{font-size:12px;color:var(--sub);margin-bottom:6px}
.tile .v{font-size:24px;font-weight:800;letter-spacing:-.5px;font-variant-numeric:tabular-nums}
.tile .v small{font-size:13px;font-weight:700;margin-left:3px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ch{background:var(--card);border-radius:16px;padding:16px 16px 14px;display:flex;flex-direction:column;min-width:0}
.ch .name{display:flex;align-items:center;gap:7px;font-size:14px;font-weight:700;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.ch .views{font-size:30px;font-weight:800;letter-spacing:-.8px;margin-top:10px;font-variant-numeric:tabular-nums}
.ch .views span{font-size:13px;color:var(--sub);font-weight:500;margin-left:2px}
.ch .d{font-size:13px;margin-top:2px;font-variant-numeric:tabular-nums}
.ch .d em{font-style:normal;color:var(--sub);margin-left:4px}
.ch svg{width:100%;height:64px;margin:12px 0 10px;display:block}
.ch .foot{display:flex;justify-content:space-between;font-size:13px;color:var(--sub);margin-top:auto}
.ch .foot b{color:var(--text)}
.up{color:var(--up)} .down{color:var(--down)} .flat{color:var(--sub)}
.msg{color:var(--sub);text-align:center;padding:48px 0;font-size:14px;line-height:1.7}
@media (max-width:420px){
  .tile{padding:12px 10px 14px}.tile .v{font-size:20px}
  .ch{padding:14px 12px 12px}.ch .views{font-size:24px}
}
/* 영상별 초반 성장 */
.sec{display:flex;justify-content:space-between;align-items:baseline;margin:26px 0 10px}
.sec h2{font-size:16px;font-weight:800}
.sec span{font-size:12px;color:var(--sub)}
.chips{display:flex;gap:6px;margin-bottom:10px;overflow-x:auto}
.chips button{border:1px solid var(--line);background:none;color:var(--sub);font:inherit;font-size:12px;
  padding:6px 11px;border-radius:999px;white-space:nowrap;cursor:pointer}
.chips button.on{background:#262c3b;border-color:#262c3b;color:var(--text);font-weight:700}
.vchart{background:var(--card);border-radius:16px;padding:12px 10px 8px;margin-bottom:10px}
.vchart svg{width:100%;height:auto;display:block}
.vchart text{fill:var(--sub);font-size:10px;font-family:inherit}
.vchart .cap{font-size:12px;color:var(--sub);padding:0 4px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vchart .cap b{color:var(--text)}
.vrow{background:var(--card);border-radius:14px;padding:12px 14px;margin-bottom:8px;cursor:pointer;
  border:1.5px solid transparent}
.vrow.sel{border-color:#3a4258}
.vhead{display:flex;gap:10px;align-items:flex-start}
.vt{flex:1;min-width:0;font-size:14px;font-weight:700;line-height:1.4;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.vv{font-size:18px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.vmeta{font-size:12px;color:var(--sub);margin:4px 0 10px;display:flex;align-items:center;gap:6px}
.vmeta .dot{width:8px;height:8px}
.tag{font-size:11px;padding:1px 6px;border-radius:5px;background:#262c3b;color:var(--sub)}
.cps{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.cp{background:#0f121a;border-radius:8px;padding:6px 2px;text-align:center}
.cp .h{font-size:10px;color:var(--sub)}
.cp .n{font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:1px}
.cp .n.wait{color:#4a5266;font-weight:500}
.cp .r{font-size:10px;font-weight:700;margin-top:1px}
</style>
</head>
<body>
<div class="top"><h1>채널 현황</h1><div class="upd" id="upd"></div></div>
<div class="seg" id="seg">
  <button data-h="24" class="on">24시간</button>
  <button data-h="168">7일</button>
  <button data-h="720">30일</button>
</div>
<div id="app"><div class="msg">불러오는 중…</div></div>
<div id="vsec"></div>

<script>
let DATA = null, RANGE = 24;
try { RANGE = +localStorage.getItem("range") || 24; } catch (e) {}

const fmt = n => {
  if (n == null) return "-";
  if (n >= 1e8) return (n / 1e8).toFixed(n >= 1e9 ? 0 : 1).replace(/\.0$/, "") + "억";
  if (n >= 1e4) return (n / 1e4).toFixed(n >= 1e5 ? 0 : 1).replace(/\.0$/, "") + "만";
  return n.toLocaleString("ko-KR");
};
const sign = n => n == null ? "" : (n > 0 ? "+" : n < 0 ? "−" : "±") + Math.abs(n).toLocaleString("ko-KR");
const cls = n => n > 0 ? "up" : n < 0 ? "down" : "flat";
const label = h => h === 24 ? "24시간" : h === 168 ? "7일" : "30일";

function kst(iso) {
  const d = new Date(iso);
  return d.toLocaleString("ko-KR", { timeZone: "Asia/Seoul", month: "numeric", day: "numeric",
    hour: "2-digit", minute: "2-digit", hour12: false });
}

// 기준 시각 이전의 가장 늦은 기록 (없으면 가장 오래된 기록)
function baseSnap(snaps, h) {
  const cut = Date.parse(snaps[snaps.length - 1].t) - h * 3600e3;
  let base = snaps[0];
  for (const s of snaps) { if (Date.parse(s.t) <= cut) base = s; else break; }
  return base;
}

function spark(points, color) {
  const W = 300, H = 64, P = 3;
  if (points.length < 2) {
    return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><line x1="0" y1="${H - P}" x2="${W}" y2="${H - P}" stroke="${color}" stroke-width="2.5"/></svg>`;
  }
  const t0 = points[0][0], t1 = points[points.length - 1][0];
  const vs = points.map(p => p[1]);
  const lo = Math.min(...vs), hi = Math.max(...vs), span = hi - lo || 1;
  const xy = points.map(([t, v]) => [
    ((t - t0) / ((t1 - t0) || 1)) * W,
    H - P - ((v - lo) / span) * (H - P * 2)
  ]);
  const line = xy.map((p, i) => (i ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1)).join("");
  const id = "g" + color.replace("#", "");
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
    <defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="${color}" stop-opacity=".28"/><stop offset="1" stop-color="${color}" stop-opacity=".04"/></linearGradient></defs>
    <path d="${line}L${W} ${H}L0 ${H}Z" fill="url(#${id})"/>
    <path d="${line}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
  </svg>`;
}

function render() {
  const app = document.getElementById("app");
  const snaps = (DATA && DATA.snapshots) || [];
  if (!snaps.length) { app.innerHTML = '<div class="msg">아직 기록이 없습니다.<br>첫 수집이 끝나면 표시됩니다.</div>'; return; }

  const last = snaps[snaps.length - 1], base = baseSnap(snaps, RANGE);
  const realH = Math.round((Date.parse(last.t) - Date.parse(base.t)) / 3600e3);
  const short = realH < RANGE - 1;
  const lbl = realH < 1 ? "수집 중" : short ? `${realH}시간` : label(RANGE);
  const cutT = Date.parse(base.t);
  const inRange = snaps.filter(s => Date.parse(s.t) >= cutT);

  let totV = 0, totS = 0, dV = 0, dS = 0, anyS = false;
  const cards = DATA.channels.map(ch => {
    const cur = last.c[ch.handle], old = base.c[ch.handle];
    if (!cur) return `<div class="ch"><div class="name"><span class="dot" style="background:${ch.color}"></span>${ch.name}</div><div class="msg" style="padding:24px 0">데이터 없음</div></div>`;
    const dv = old ? cur.v - old.v : null;
    const ds = old && cur.s != null && old.s != null ? cur.s - old.s : null;
    totV += cur.v; dV += dv || 0;
    if (cur.s != null) { totS += cur.s; dS += ds || 0; anyS = true; }
    const pts = inRange.filter(s => s.c[ch.handle]).map(s => [Date.parse(s.t), s.c[ch.handle].v]);
    return `<div class="ch">
      <div class="name"><span class="dot" style="background:${ch.color}"></span>${ch.name}</div>
      <div class="views">${fmt(cur.v)}<span>회</span></div>
      <div class="d ${cls(dv)}">${sign(dv)}<em>${lbl}</em></div>
      ${spark(pts, ch.color)}
      <div class="foot"><span>구독 <b>${cur.s == null ? "-" : cur.s.toLocaleString("ko-KR")}</b>${ds ? ` <span class="${cls(ds)}">${sign(ds)}</span>` : ""}</span><span>영상 ${cur.n}</span></div>
    </div>`;
  }).join("");

  app.innerHTML = `
    <div class="sum">
      <div class="tile"><div class="k">${lbl} 조회</div><div class="v ${cls(dV)}">${sign(dV)}</div></div>
      <div class="tile"><div class="k">구독자</div><div class="v">${anyS ? totS.toLocaleString("ko-KR") : "-"}${dS ? `<small class="${cls(dS)}">${sign(dS)}</small>` : ""}</div></div>
      <div class="tile"><div class="k">총 조회수</div><div class="v">${fmt(totV)}</div></div>
    </div>
    <div class="grid">${cards}</div>`;
  document.getElementById("upd").textContent = kst(DATA.updated) + " 기준";
}

document.querySelectorAll("#seg button").forEach(b => {
  b.classList.toggle("on", +b.dataset.h === RANGE);
  b.onclick = () => {
    RANGE = +b.dataset.h;
    try { localStorage.setItem("range", RANGE); } catch (e) {}
    document.querySelectorAll("#seg button").forEach(x => x.classList.toggle("on", x === b));
    render();
  };
});

/* ───── 영상별 초반 성장 ───── */
let VDATA = null, VCH = "all", VSEL = null, VX = 48;
const CPS = [1, 3, 6, 24, 48];

// 업로드 후 H시간 조회수 (기록 사이는 직선 보간). 추적 전이면 undefined, 아직이면 null
function valAt(pts, H) {
  let p = pts.slice().sort((a, b) => a[0] - b[0]);
  if (p.length && p[0][0] <= 1.5) p = [[0, 0], ...p];
  if (!p.length || H > p[p.length - 1][0] + 0.25) return null;
  if (H < p[0][0] - 0.25) return undefined;
  for (let i = 1; i < p.length; i++) {
    if (H <= p[i][0]) {
      const [h0, v0] = p[i - 1], [h1, v1] = p[i];
      return Math.round(v0 + (v1 - v0) * ((H - h0) / ((h1 - h0) || 1)));
    }
  }
  return p[p.length - 1][1];
}

function median(a) {
  if (!a.length) return null;
  const s = a.slice().sort((x, y) => x - y), m = s.length >> 1;
  return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2;
}

function vchart(list, chMap) {
  const W = 340, H = 170, L = 34, R = 8, T = 8, B = 20;
  const pw = W - L - R, ph = H - T - B;
  const lines = list.slice(0, 8);
  let ymax = 1;
  lines.forEach(v => v.pts.forEach(([h, n]) => { if (h <= VX) ymax = Math.max(ymax, n); }));
  const X = h => L + (Math.min(h, VX) / VX) * pw, Y = n => T + ph - (n / ymax) * ph;
  const ticks = VX === 48 ? [0, 6, 12, 24, 48] : [0, 24, 48, 96, 168];
  let g = ticks.map(t => `<line x1="${X(t)}" y1="${T}" x2="${X(t)}" y2="${T + ph}" stroke="#222838"/>
    <text x="${X(t)}" y="${H - 5}" text-anchor="middle">${t}h</text>`).join("");
  g += `<line x1="${L}" y1="${T + ph}" x2="${W - R}" y2="${T + ph}" stroke="#2c3346"/>
    <text x="${L - 5}" y="${T + 8}" text-anchor="end">${fmt(ymax)}</text>
    <text x="${L - 5}" y="${T + ph}" text-anchor="end">0</text>`;
  const draw = (v, sel) => {
    let p = v.pts.filter(x => x[0] <= VX + 1).sort((a, b) => a[0] - b[0]);
    if (p.length && p[0][0] <= 1.5) p = [[0, 0], ...p];
    if (p.length < 2) return p.length ? `<circle cx="${X(p[0][0])}" cy="${Y(p[0][1])}" r="${sel ? 3.5 : 2}" fill="${sel ? chMap[v.ch].color : "#4a5266"}"/>` : "";
    const d = p.map((x, i) => (i ? "L" : "M") + X(x[0]).toFixed(1) + " " + Y(x[1]).toFixed(1)).join("");
    return `<path d="${d}" fill="none" stroke="${sel ? chMap[v.ch].color : "#3d4558"}" stroke-width="${sel ? 2.6 : 1.4}" stroke-linejoin="round" stroke-linecap="round"/>`;
  };
  const selV = lines.find(v => v.id === VSEL);
  lines.filter(v => v.id !== VSEL).forEach(v => g += draw(v, false));
  if (selV) g += draw(selV, true);
  return `<svg viewBox="0 0 ${W} ${H}">${g}</svg>`;
}

function renderVideos() {
  const box = document.getElementById("vsec");
  if (!VDATA || !DATA) { box.innerHTML = ""; return; }
  const chMap = Object.fromEntries(DATA.channels.map(c => [c.handle, c]));
  const all = Object.entries(VDATA.videos || {}).map(([id, v]) => ({ id, ...v }))
    .filter(v => chMap[v.ch] && v.pts && v.pts.length)
    .sort((a, b) => Date.parse(b.p) - Date.parse(a.p));
  const list = all.filter(v => VCH === "all" || v.ch === VCH).slice(0, 20);
  if (!list.find(v => v.id === VSEL)) VSEL = list.length ? list[0].id : null;

  // 채널별 시점 중앙값 (비교용)
  const med = {};
  for (const c of DATA.channels) {
    med[c.handle] = {};
    for (const h of CPS) {
      med[c.handle][h] = all.filter(v => v.ch === c.handle).map(v => ({ id: v.id, n: valAt(v.pts, h) }))
        .filter(x => x.n != null);
    }
  }

  const chips = [["all", "전체"], ...DATA.channels.map(c => [c.handle, c.name])]
    .map(([k, n]) => `<button data-ch="${k}" class="${k === VCH ? "on" : ""}">${n}</button>`).join("")
    + `<button data-x="${VX === 48 ? 168 : 48}" style="margin-left:auto">${VX === 48 ? "48시간" : "7일"} 보기 ⇄</button>`;

  const sel = list.find(v => v.id === VSEL);
  const rows = list.map(v => {
    const ch = chMap[v.ch], age = v.pts[v.pts.length - 1][0], now = v.pts[v.pts.length - 1][1];
    const cps = CPS.map(h => {
      const n = valAt(v.pts, h);
      let ratio = "";
      if (n != null) {
        const others = med[v.ch][h].filter(x => x.id !== v.id).map(x => x.n);
        const m = others.length >= 2 ? median(others) : null;
        if (m) {
          const r = Math.round((n / m - 1) * 100);
          ratio = `<div class="r ${cls(r)}">${r > 0 ? "+" : ""}${r}%</div>`;
        }
      }
      const val = n === null ? `<div class="n wait">대기</div>` : n === undefined ? `<div class="n wait">–</div>` : `<div class="n">${fmt(n)}</div>`;
      return `<div class="cp"><div class="h">${h}시간</div>${val}${ratio}</div>`;
    }).join("");
    const ageTxt = age < 48 ? `${Math.floor(age)}시간 경과` : `${Math.floor(age / 24)}일 경과`;
    return `<div class="vrow ${v.id === VSEL ? "sel" : ""}" data-id="${v.id}">
      <div class="vhead"><div class="vt">${esc(v.title || v.id)}</div><div class="vv">${fmt(now)}</div></div>
      <div class="vmeta"><span class="dot" style="background:${ch.color}"></span>${kst(v.p)} · ${ageTxt}${v.sec > 180 ? ' <span class="tag">롱폼</span>' : ""}</div>
      <div class="cps">${cps}</div>
    </div>`;
  }).join("");

  box.innerHTML = `
    <div class="sec"><h2>영상별 초반 성장</h2><span>%는 채널 다른 영상 중앙값 대비</span></div>
    <div class="chips" id="vchips">${chips}</div>
    ${list.length ? `<div class="vchart"><div class="cap">${sel ? `<b>${esc(sel.title || "")}</b>` : ""}</div>${vchart(list, chMap)}</div>${rows}`
      : '<div class="msg">최근 7일 안에 올라온 영상이 생기면 여기부터 기록됩니다.</div>'}`;

  box.querySelectorAll("#vchips button").forEach(b => b.onclick = () => {
    if (b.dataset.x) VX = +b.dataset.x; else { VCH = b.dataset.ch; VSEL = null; }
    renderVideos();
  });
  box.querySelectorAll(".vrow").forEach(r => r.onclick = () => { VSEL = r.dataset.id; renderVideos(); });
}

const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

async function load() {
  try {
    const r = await fetch("data/history.json?t=" + Date.now(), { cache: "no-store" });
    if (!r.ok) throw new Error(r.status);
    DATA = await r.json();
    render();
  } catch (e) {
    document.getElementById("app").innerHTML = '<div class="msg">아직 기록이 없습니다.<br>첫 수집이 끝나면 표시됩니다.</div>';
  }
  try {
    const r = await fetch("data/videos.json?t=" + Date.now(), { cache: "no-store" });
    if (r.ok) VDATA = await r.json();
  } catch (e) {}
  renderVideos();
}
load();
setInterval(load, 10 * 60e3);
document.addEventListener("visibilitychange", () => { if (!document.hidden) load(); });
</script>
</body>
</html>
