<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0d12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="채널 현황">
<meta name="robots" content="noindex">
<title>채널 현황</title>
<style>
:root{
  --bg:#0b0d12; --card:#141822; --card2:#1b2130; --line:#242b3c; --grid:#1f2535;
  --text:#f2f4f8; --sub:#9aa3b5; --mute:#667086;
  --up:#3ecf7a; --down:#f47272; --warn:#fab219;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg)}
body{color:var(--text);font-family:system-ui,-apple-system,"Segoe UI","Malgun Gothic","Apple SD Gothic Neo",sans-serif;
  font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;
  padding:0 max(16px,env(safe-area-inset-right)) calc(env(safe-area-inset-bottom) + 40px) max(16px,env(safe-area-inset-left))}
.wrap{max-width:1120px;margin:0 auto}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
.num{font-variant-numeric:tabular-nums}

/* 머리 */
.top{position:sticky;top:0;z-index:5;background:var(--bg);margin:0 -16px;padding:calc(env(safe-area-inset-top) + 12px) 16px 0;border-bottom:1px solid var(--line)}
.top .in{max-width:1120px;margin:0 auto}
.hd{display:flex;justify-content:space-between;align-items:baseline;gap:8px 12px;flex-wrap:wrap}
.hd h1{font-size:18px;font-weight:800}
.upd{font-size:12px;color:var(--sub)}
.chs{display:flex;gap:6px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none}
.chs::-webkit-scrollbar{display:none}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:none;color:var(--sub);
  font-size:13px;padding:6px 12px;border-radius:999px;white-space:nowrap}
.chip.on{background:var(--card2);border-color:#3a4460;color:var(--text);font-weight:700}
.dot{width:9px;height:9px;border-radius:50%;flex:none;display:inline-block}
.tabs{display:flex;gap:2px;margin-top:6px}
.tabs button{border:0;background:none;color:var(--sub);font-size:14px;font-weight:600;padding:9px 14px 10px;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--text);border-bottom-color:var(--text)}

/* 공통 */
.sec{margin-top:22px}
.sech{display:flex;justify-content:space-between;align-items:center;gap:6px 10px;flex-wrap:wrap;margin-bottom:10px}
.sech h2{font-size:15px;font-weight:800}
.sech .note{font-size:12px;color:var(--sub)}
.card{background:var(--card);border-radius:14px;padding:14px}
.seg{display:inline-flex;background:var(--card);border-radius:9px;padding:3px}
.seg button{border:0;background:none;color:var(--sub);font-size:12.5px;font-weight:600;padding:5px 11px;border-radius:7px;white-space:nowrap}
.seg button.on{background:#2a3247;color:var(--text)}
.msg{color:var(--sub);text-align:center;padding:36px 0;font-size:13.5px;line-height:1.7}
.up{color:var(--up)} .down{color:var(--down)} .flat{color:var(--sub)}
.foot{font-size:12px;color:var(--mute);margin-top:8px;line-height:1.6}

/* 숫자 타일 */
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tile{background:var(--card);border-radius:14px;padding:12px 14px 13px;min-width:0}
.tile .k{font-size:12px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .v{font-size:22px;font-weight:800;letter-spacing:-.4px;margin-top:3px;white-space:nowrap}
.tile .d{font-size:12px;margin-top:1px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:640px){.tiles{grid-template-columns:repeat(2,1fr)}.tile .v{font-size:20px}}

/* 표 */
.tw{background:var(--card);border-radius:14px;overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:13px}
th,td{padding:9px 10px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
tr:last-child td{border-bottom:0}
th{font-size:12px;font-weight:600;color:var(--sub);background:var(--card);user-select:none}
th.s{cursor:pointer}
th.on{color:var(--text)}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--card);z-index:1}
tbody tr{cursor:pointer}
tbody tr:hover td{background:var(--card2)}
td .mk{font-size:9px;margin-right:3px;vertical-align:1px}
td.na{color:var(--mute)}
.cname{display:flex;align-items:center;gap:7px;font-weight:700}
.bar{height:6px;border-radius:3px;background:var(--grid);overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;border-radius:3px}

/* 영상 표 */
.vcell{display:flex;gap:9px;align-items:center;width:44vw;max-width:330px;min-width:150px}
.vcell img{width:56px;height:32px;border-radius:5px;object-fit:cover;flex:none;background:var(--card2)}
.vcell .t{font-weight:600;white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.35;font-size:13px}
.vcell .m{font-size:11.5px;color:var(--sub);display:flex;align-items:center;gap:5px;margin-top:2px;white-space:nowrap}
.vcell .m .dot{width:7px;height:7px}
.tag{font-size:10.5px;padding:0 5px;border-radius:4px;background:#2a3247;color:var(--sub)}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
@media (max-width:640px){.vcell img,.vcell .cn{display:none}.vcell{width:34vw;min-width:124px}th,td{padding:9px 7px}th:first-child,td:first-child{padding-left:12px}}

/* 휴대폰: 표 대신 카드 */
.vlist{display:flex;flex-direction:column;gap:8px}
.vc{background:var(--card);border-radius:14px;padding:12px 14px;cursor:pointer}
.vc .t{font-weight:600;line-height:1.38;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.vc .m{font-size:12px;color:var(--sub);margin-top:4px;display:flex;align-items:center;gap:5px;white-space:nowrap;overflow:hidden}
.vc .m .dot{width:7px;height:7px}
.g4,.g3{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.g3{grid-template-columns:repeat(3,1fr);row-gap:10px}
.g4 div,.g3 div{min-width:0}
.g4 .k,.g3 .k{font-size:11px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.g4 .v,.g3 .v{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;margin-top:1px}
.g4 .v.na,.g3 .v.na{color:var(--mute);font-weight:500}
.g4 .mk,.g3 .mk{font-size:9px;margin-right:2px;vertical-align:2px}
.cc{background:var(--card);border-radius:14px;padding:12px 14px;cursor:pointer}
.cc .h{display:flex;align-items:center;gap:8px}
.cc .h .cname{flex:1;min-width:0}
.cc .h .s{font-size:13px;color:var(--sub);white-space:nowrap}
.cc .h .s b{color:var(--text);font-size:15px}
select.sel{font:inherit;font-size:13px;color:var(--text);background:var(--card);border:1px solid var(--line);border-radius:9px;padding:7px 10px;max-width:100%}
.dirb{font-size:13px;font-weight:600;background:var(--card);border:1px solid var(--line);border-radius:9px;padding:7px 11px;color:var(--text)}
.mline{font-size:12px;color:var(--sub);margin-top:5px}
.mline b{color:var(--text);font-weight:600}
.mc + .mc{margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.mc .mrow{margin-top:6px}
@media (max-width:640px){
  body{font-size:14.5px}
  .hd h1{font-size:17px}
  .tabs button{flex:1;padding:10px 6px 11px}
  .seg button{padding:7px 11px;font-size:13px}
  .sech{margin-bottom:8px}
  .tile{padding:11px 12px 12px}
  .sheet{width:100%;padding-left:16px;padding-right:16px}
  .mg .v{font-size:15px}
}

/* 수익 조건 */
.mon{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px}
.mon .card{padding:12px 14px}
.mrow{display:grid;grid-template-columns:74px 1fr auto;gap:8px;align-items:center;font-size:12.5px;margin-top:8px}
.mrow .l{color:var(--sub)}
.mrow .r{font-variant-numeric:tabular-nums;white-space:nowrap}
.mrow .r small{color:var(--mute)}

/* 그림 */
.chart{position:relative}
.chart svg{display:block;width:100%}
.chart text{fill:var(--mute);font-size:10.5px;font-family:inherit}
.legend{display:flex;gap:4px 12px;flex-wrap:wrap;font-size:12px;color:var(--sub);margin-bottom:8px}
.legend span{display:inline-flex;align-items:center;gap:5px}
#tip{position:fixed;z-index:30;pointer-events:none;background:#0d1017;border:1px solid #333c52;border-radius:9px;padding:8px 10px;font-size:12px;
  box-shadow:0 8px 24px rgba(0,0,0,.5);max-width:240px;display:none}
#tip b{display:block;margin-bottom:3px;font-size:12px}
#tip .r{display:flex;justify-content:space-between;gap:14px;color:var(--sub)}
#tip .r span:last-child{color:var(--text);font-variant-numeric:tabular-nums}
.tr{display:grid;grid-template-columns:minmax(90px,150px) 1fr auto;gap:10px;align-items:center;font-size:13px;padding:5px 0}
.tr .r{color:var(--sub);font-variant-numeric:tabular-nums;white-space:nowrap}
.two{display:grid;grid-template-columns:1.5fr 1fr;gap:16px}
@media (max-width:820px){.two{grid-template-columns:1fr}}

/* 영상 상세 */
.scrim{position:fixed;inset:0;background:rgba(5,7,11,.6);z-index:20}
.sheet{position:fixed;z-index:21;background:var(--card);overflow-y:auto;
  right:0;top:0;bottom:0;width:min(520px,100%);padding:calc(env(safe-area-inset-top) + 16px) 18px calc(env(safe-area-inset-bottom) + 24px);box-shadow:-12px 0 40px rgba(0,0,0,.5)}
.sheet h3{font-size:16px;line-height:1.4;font-weight:800;padding-right:40px}
.sheet .x{position:absolute;top:calc(env(safe-area-inset-top) + 12px);right:14px;width:34px;height:34px;border-radius:9px;border:0;background:var(--card2);font-size:18px}
.sheet .meta{font-size:12.5px;color:var(--sub);margin-top:6px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.btns{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.btn{display:inline-block;text-decoration:none;font-size:13px;font-weight:600;padding:8px 12px;border-radius:9px;background:var(--card2);border:1px solid var(--line)}
.mg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:6px}
.mg div{background:var(--bg);border-radius:10px;padding:8px 10px;min-width:0}
.mg .k{font-size:11.5px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mg .v{font-size:16px;font-weight:700;margin-top:1px}
.mg .c{font-size:11px;margin-top:1px}
.sheet h4{font-size:13px;font-weight:700;margin:18px 0 6px;display:flex;justify-content:space-between;align-items:center}

/* 경쟁 채널 */
.rrow{display:block;text-decoration:none;background:var(--card);border-radius:12px;padding:11px 14px;margin-bottom:7px}
.rrow.hot{box-shadow:inset 3px 0 0 #fb923c}
.rh{display:flex;gap:10px;align-items:flex-start}
.rh .t{flex:1;min-width:0;font-weight:600;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.rh .v{font-size:16px;font-weight:800;white-space:nowrap}
.rm{font-size:12px;color:var(--sub);margin-top:4px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.badge{font-size:11.5px;font-weight:700;padding:2px 7px;border-radius:6px;background:#2a3247;color:var(--sub)}
.badge.b2{background:rgba(62,207,122,.14);color:var(--up)}
.badge.b3{background:rgba(251,146,60,.16);color:#fb923c}
</style>
</head>
<body>
<div class="top"><div class="in">
  <div class="hd"><h1>채널 현황</h1><div class="upd" id="upd"></div></div>
  <div class="chs" id="chs"></div>
  <div class="tabs" id="tabs">
    <button data-tab="sum">요약</button><button data-tab="vid">영상</button><button data-tab="riv">경쟁 채널</button>
  </div>
</div></div>
<div class="wrap" id="app"><div class="msg">불러오는 중…</div></div>
<div id="sheet"></div>
<div id="tip"></div>

<script>
/* ───────── 상태 ───────── */
const S = { tab: "sum", ch: "all", per: "28", cols: null, vtype: "all", sort: "p", dir: -1, dm: "v", vx: 48, sel: null, rg: null, rsort: "hot" };
try { Object.assign(S, JSON.parse(localStorage.getItem("dash2") || "{}"), { sel: null }); } catch (e) {}
const keep = () => { try { localStorage.setItem("dash2", JSON.stringify(S)); } catch (e) {} };
let H = null, V = null, ST = null, R = null;          // history, videos, studio, rivals
let CH = [], CM = {}, SER = {}, LAST = 0, VID = [];

/* ───────── 표기 ───────── */
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const int = n => n == null ? "–" : Math.round(n).toLocaleString("ko-KR");
const short = n => {
  if (n == null) return "–";
  const a = Math.abs(n);
  if (a >= 1e8) return (n / 1e8).toFixed(a >= 1e9 ? 0 : 1).replace(/\.0$/, "") + "억";
  if (a >= 1e4) return (n / 1e4).toFixed(a >= 1e5 ? 0 : 1).replace(/\.0$/, "") + "만";
  return Math.round(n).toLocaleString("ko-KR");
};
const pct = n => n == null ? "–" : n.toFixed(1) + "%";
const one = n => n == null ? "–" : n.toFixed(1);
const dur = s => s == null ? "–" : Math.floor(s / 60) + ":" + String(Math.round(s % 60)).padStart(2, "0");
const hrs = n => n == null ? "–" : (n >= 100 ? int(n) : n.toFixed(1)) + "시간";
const sign = n => n == null ? "–" : (n > 0 ? "+" : n < 0 ? "−" : "") + Math.abs(Math.round(n)).toLocaleString("ko-KR");
const cls = n => n > 0 ? "up" : n < 0 ? "down" : "flat";
const DAY = 864e5, KO = 9 * 36e5;
const kday = ms => new Date(ms + KO).toISOString().slice(0, 10);          // 한국 날짜
const kstart = d => Date.parse(d + "T00:00:00+09:00");
const md = d => +d.slice(5, 7) + "." + +d.slice(8, 10);
const kst = iso => new Date(iso).toLocaleString("ko-KR", { timeZone: "Asia/Seoul", month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit", hour12: false });
const median = a => { if (!a.length) return null; const s = a.slice().sort((x, y) => x - y), m = s.length >> 1; return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2; };

/* ───────── 공개 숫자(1시간마다) ───────── */
function prep() {
  CH = (H && H.channels) || []; CM = Object.fromEntries(CH.map(c => [c.handle, c]));
  if (S.ch !== "all" && !CM[S.ch]) S.ch = "all";
  const snaps = (H && H.snapshots) || [];
  LAST = snaps.length ? Date.parse(snaps[snaps.length - 1].t) : 0;
  SER = {};
  for (const c of CH) SER[c.handle] = { t: [], v: [], s: [], n: [] };
  for (const s of snaps) { const t = Date.parse(s.t); for (const k in s.c) if (SER[k]) { const x = s.c[k], q = SER[k]; q.t.push(t); q.v.push(x.v); q.s.push(x.s); q.n.push(x.n); } }
  // 영상
  const upd = V && V.updated;
  VID = Object.entries((V && V.videos) || {}).map(([id, v]) => ({ id, ...v }))
    .filter(v => CM[v.ch] && (!v.seen || v.seen === upd))
    .map(v => {
      const pts = (v.pts || []).slice().sort((a, b) => a[0] - b[0]);
      const sv = (ST && ST.videos && ST.videos[v.id]) || null;
      const views = v.v != null ? v.v : (pts.length ? pts[pts.length - 1][1] : (sv ? sv.v : null));
      const age = (Date.now() - Date.parse(v.p)) / 36e5;
      const o = { id: v.id, ch: v.ch, p: Date.parse(v.p), title: v.title || v.id, sec: v.sec || 0, long: (v.sec || 0) > 180, pts, age,
        v: views, likes: v.likes ?? (sv && sv.likes), cm: v.cm ?? (sv && sv.cm), sv };
      for (const k of ["ev", "stay", "avp", "awt", "subs", "shares", "imp", "ctr", "wh"]) o[k] = sv ? sv[k] : null;
      o.spk = sv && sv.v >= 100 && sv.subs != null ? sv.subs / sv.v * 1000 : null;
      for (const h of [1, 3, 6, 24, 48]) { const x = valAt(pts, h); o["h" + h] = x == null ? null : x; o["w" + h] = x === null; }
      return o;
    });
}
function at(h, t) {             // 그 시각의 누적 조회·구독 (기록 사이는 직선으로 이음). 기록 시작 전이면 null
  const q = SER[h]; if (!q || !q.t.length || t < q.t[0]) return null;
  const n = q.t.length; if (t >= q.t[n - 1]) return { v: q.v[n - 1], s: q.s[n - 1] };
  let lo = 0, hi = n - 1; while (hi - lo > 1) { const m = (lo + hi) >> 1; if (q.t[m] <= t) lo = m; else hi = m; }
  const f = (t - q.t[lo]) / ((q.t[hi] - q.t[lo]) || 1);
  return { v: q.v[lo] + (q.v[hi] - q.v[lo]) * f, s: q.s[lo] };
}
const cur = h => { const q = SER[h]; if (!q || !q.t.length) return null; const i = q.t.length - 1; return { v: q.v[i], s: q.s[i], n: q.n[i], t: q.t[i] }; };
function delta(h, hours) {      // 최근 hours 시간의 조회·구독 변화. 기록이 모자라면 full=false
  const c = cur(h); if (!c) return null;
  const q = SER[h], start = LAST - hours * 36e5;
  let a = at(h, start), full = true;
  if (!a) { a = { v: q.v[0], s: q.s[0] }; full = false; }
  return { dv: c.v - a.v, ds: c.s != null && a.s != null ? c.s - a.s : null, full, got: (LAST - Math.max(start, q.t[0])) / 36e5 };
}
function pubDay(h, d) {         // 그 날(한국 시각) 하루 조회수 — 공개 숫자 차이
  const s = kstart(d), e = Math.min(s + DAY, LAST); if (e <= s) return null;
  const a = at(h, s), b = at(h, e); return a && b ? Math.max(0, Math.round(b.v - a.v)) : null;
}

/* ───────── 스튜디오 숫자(이틀 늦음) ───────── */
const sch = h => (ST && ST.channels && ST.channels[h]) || null;
function dayVal(h, d, m) {
  const c = sch(h), row = c && c.daily && c.daily.find(x => x.d === d);
  if (row) return m === "subs" ? (row.sg ?? 0) - (row.sl ?? 0) : row[m];
  return m === "v" ? pubDay(h, d) : null;
}
function sp(h, per) {           // 채널의 기간 지표
  const c = sch(h); if (!c) return null;
  if (per === "all") return c.total ? { ...c.total } : null;
  if (per === "28" && c.p28) return { ...c.p28, subs: (c.p28.sg ?? 0) - (c.p28.sl ?? 0) };
  const rows = (c.daily || []).slice(-(+per)); if (!rows.length) return null;
  const sum = k => rows.reduce((a, r) => a + (r[k] || 0), 0);
  const w = (k, wk) => { let a = 0, b = 0; for (const r of rows) if (r[k] != null && r[wk]) { a += r[k] * r[wk]; b += r[wk]; } return b ? a / b : null; };
  return { v: sum("v"), ev: sum("ev"), wh: sum("wh"), subs: sum("sg") - sum("sl"), imp: sum("imp"), stay: w("stay", "v"), avp: w("avp", "v"), ctr: w("ctr", "imp") };
}
function agg(list) {            // 여러 채널 합치기 (비율은 조회수·노출수로 가중 평균)
  list = list.filter(Boolean); if (!list.length) return null;
  const sum = k => list.reduce((a, r) => a + (r[k] || 0), 0);
  const w = (k, wk) => { let a = 0, b = 0; for (const r of list) if (r[k] != null && r[wk]) { a += r[k] * r[wk]; b += r[wk]; } return b ? a / b : null; };

    <h4>핵심</h4><div class="mg">${cell("v", "조회수", int, 1)}${cell("stay", "계속 시청함", pct, 1)}${cell("avp", "평균 조회율", pct, 1)}
      ${cell("awt", "평균 시청", dur)}${cell("subs", "구독", sign)}${cell("spk", "1천 회당 구독", one, 1)}</div>
    <h4>반응·도달</h4><div class="mg">${cell("likes", "좋아요", int)}${cell("cm", "댓글", int)}${cell("shares", "공유", int)}
      ${cell("ev", "유효 조회", int)}${cell("wh", "시청 시간", hrs)}${cell("imp", "썸네일 노출", int)}${cell("ctr", "클릭률", pct)}</div>
    ${v.sv ? "" : `<div class="foot">스튜디오 숫자가 아직 없습니다(올린 지 이틀이 안 됐거나, 이 채널 숫자를 받지 못함).</div>`}
    <h4>초반 성장 <span class="seg" id="vxSeg"><button data-x="48" class="${S.vx === 48 ? "on" : ""}">48시간</button><button data-x="168" class="${S.vx === 168 ? "on" : ""}">7일</button></span></h4>
    <div class="legend"><span><i style="width:16px;height:0;border-top:2.4px solid ${c.color};display:inline-block"></i>이 영상</span><span><i style="width:16px;height:0;border-top:1.6px dashed #7b859b;display:inline-block"></i>채널 ${v.long ? "롱폼" : "쇼츠"} 중앙값</span></div>
    <div class="chart" id="gchart"></div>
    <div class="mg" style="grid-template-columns:repeat(5,1fr);margin-top:8px">${cps}</div>
    <div class="foot">%는 같은 채널 ${v.long ? "롱폼" : "쇼츠"}의 같은 시점 중앙값과 비교</div>
  </aside>`;
  document.body.style.overflow = "hidden";
  growth($("gchart"), v);
  const close = () => { S.sel = null; hideTip(); renderSheet(); };
  $("scrim").onclick = close; $("sx").onclick = close;
  document.querySelectorAll("#vxSeg button").forEach(b => b.onclick = () => { S.vx = +b.dataset.x; keep(); renderSheet(); });
}
document.addEventListener("keydown", e => { if (e.key === "Escape" && S.sel) { S.sel = null; renderSheet(); } });

/* ───────── 경쟁 채널 ───────── */
function renderRiv() {
  if (!R || !R.groups || !R.groups.length) { $("app").innerHTML = '<div class="sec card msg">경쟁 채널 기록이 아직 없습니다.</div>'; return; }
  if (!S.rg || !R.groups.find(g => g.key === S.rg)) S.rg = R.groups[0].key;
  const C = R.channels || {};
  let list = Object.entries(R.videos || {}).map(([id, v]) => ({ id, ...v })).filter(v => C[v.c] && C[v.c].group === S.rg && v.pts && v.pts.length && v.pts[v.pts.length - 1][0] <= 168);
  list.forEach(v => {
    const ch = C[v.c], last = v.pts[v.pts.length - 1], base = v.sec <= 180 ? ch.base_s : ch.base_l, prev = v.pts.length > 1 ? v.pts[v.pts.length - 2] : null;
    v.age = last[0]; v.views = last[1]; v.ratio = base ? v.views / base : null;
    v.rate = prev && last[0] > prev[0] ? Math.round((last[1] - prev[1]) / (last[0] - prev[0])) : null;
  });
  list.sort(S.rsort === "hot" ? (a, b) => (b.ratio || 0) - (a.ratio || 0) : (a, b) => Date.parse(b.p) - Date.parse(a.p));
  const rows = list.slice(0, 30).map(v => {
    const ch = C[v.c], r = v.ratio, b = r == null ? "" : `<span class="badge ${r >= 3 ? "b3" : r >= 1.5 ? "b2" : ""}">평소의 ${r >= 10 ? Math.round(r) : r.toFixed(1)}배</span>`;
    return `<a class="rrow ${r >= 3 ? "hot" : ""}" href="${(v.sec <= 180 ? "https://youtube.com/shorts/" : "https://youtu.be/") + v.id}" target="_blank" rel="noopener">
      <div class="rh"><div class="t">${esc(v.t || v.id)}</div><div class="v num">${short(v.views)}</div></div>
      <div class="rm"><span>${esc(ch.name)}</span><span>· 구독 ${short(ch.subs)}</span><span>· ${v.age < 48 ? Math.floor(v.age) + "시간 전" : Math.floor(v.age / 24) + "일 전"}</span>${v.sec > 180 ? '<span class="tag">롱폼</span>' : ""}${b}${v.rate > 0 ? `<span class="num">· 최근 시간당 +${v.rate.toLocaleString("ko-KR")}</span>` : ""}</div></a>`;
  }).join("");
  $("app").innerHTML = `<div class="sec"><div class="filters">
    <div class="seg" id="rgSeg">${R.groups.map(g => `<button data-g="${g.key}" class="${g.key === S.rg ? "on" : ""}">${esc(g.name)}</button>`).join("")}</div>
    <div class="seg" id="rsSeg"><button data-s="hot" class="${S.rsort === "hot" ? "on" : ""}">급등순</button><button data-s="new" class="${S.rsort === "new" ? "on" : ""}">최신순</button></div></div>
    ${rows || '<div class="card msg">최근 7일 새 영상이 없거나 아직 수집 전입니다.</div>'}
    <div class="foot">최근 7일 안에 올라온 경쟁 채널 영상 · '평소의 몇 배'는 그 채널의 평소 조회수(이틀 넘은 영상 중앙값)와 비교 · ${R.updated ? kst(R.updated) + " 기준" : ""}</div></div>`;
  document.querySelectorAll("#rgSeg button").forEach(b => b.onclick = () => { S.rg = b.dataset.g; keep(); render(); });
  document.querySelectorAll("#rsSeg button").forEach(b => b.onclick = () => { S.rsort = b.dataset.s; keep(); render(); });
}

/* ───────── 틀 ───────── */
function render() {
  if (!H || !(H.snapshots || []).length) { $("app").innerHTML = '<div class="msg">아직 기록이 없습니다.<br>첫 수집이 끝나면 표시됩니다.</div>'; return; }
  $("chs").innerHTML = `<button class="chip ${S.ch === "all" ? "on" : ""}" data-ch="all">전체</button>` +
    CH.map(c => `<button class="chip ${S.ch === c.handle ? "on" : ""}" data-ch="${c.handle}"><i class="dot" style="background:${c.color}"></i>${esc(c.name)}</button>`).join("");
  document.querySelectorAll("#chs button").forEach(b => b.onclick = () => { S.ch = b.dataset.ch; keep(); render(); });
  document.querySelectorAll("#tabs button").forEach(b => { b.classList.toggle("on", b.dataset.tab === S.tab); b.onclick = () => { S.tab = b.dataset.tab; keep(); render(); scrollTo(0, 0); }; });
  $("chs").style.display = S.tab === "riv" ? "none" : "";
  $("upd").textContent = LAST ? kst(LAST) + " 기준" : "";
  hideTip();
  (S.tab === "vid" ? renderVid : S.tab === "riv" ? renderRiv : renderSum)();
}
async function get(name) { try { const r = await fetch(`data/${name}.json?t=${Date.now()}`, { cache: "no-store" }); return r.ok ? await r.json() : null; } catch (e) { return null; } }
async function load() {
  [H, V, ST, R] = await Promise.all([get("history"), get("videos"), get("studio"), get("rivals")]);
  prep(); render(); if (S.sel) renderSheet();
}
load();
setInterval(() => { if (!S.sel) load(); }, 10 * 60e3);
document.addEventListener("visibilitychange", () => { if (!document.hidden && !S.sel) load(); });
let rz; addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(() => { if (H) { render(); if (S.sel) renderSheet(); } }, 200); });
</script>
</body>
</html>
