name: stats
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python fetch_stats.py
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
      - run: python fetch_rivals.py
        continue-on-error: true
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
      - run: |
          git config user.name "stats-bot"
          git config user.email "stats-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "stats $(date -u +%FT%TZ)"
          git push
